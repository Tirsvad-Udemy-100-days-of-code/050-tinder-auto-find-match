[project]
name = "tinder-auto-find-match"
version = "0.1.0"
description = "Day 50 - Selenium bot that logs in to TinDog, dismisses pop-ups and likes profiles."
requires-python = ">=3.11"
dependencies = ["selenium>=4.20"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
